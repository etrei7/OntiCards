[Service]
Environment=REPORT_NATIVE_ACTIVITY_PATH=/var/lib/onticards-report/native-activity.json
ExecStartPre=+/usr/bin/flock --wait 60 --conflict-exit-code 75 /var/lib/onticards-report/collector.lock /opt/onticards-maintenance/reporting/.venv/bin/python -m onticards.native_activity --database /opt/onticards-maintenance/propr/data/propr.sqlite --output /var/lib/onticards-report/native-activity.json
