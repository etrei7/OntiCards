# Report mtime is the committed generated_at; recovery and reads do not extend retention.
# Keep the small SQLite ledger and day-boundary snapshots for report recovery.
d /var/lib/onticards-report 0700 onticards-report onticards-report - -
d /var/lib/onticards-report/reports 0700 onticards-report onticards-report mM:30d -
# Nginx's existing read-only reports bind mount uses UID 101. Restore its ACL
# after d resets the mode/mask, and inherit read-only access on new report files.
# Append preserves existing administrator ACLs; do not add UID 1000 on new hosts.
a+ /var/lib/onticards-report/reports - - - - u:101:r-x,m::r-x,d:u::rwx,d:u:101:r-x,d:g::---,d:m::r-x,d:o::---
