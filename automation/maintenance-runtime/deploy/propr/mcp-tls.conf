# Reuse the existing local CA and SAN-valid certificate. No shared 443 changes.
# Service-only listener. The user-facing HTTP entry remains unchanged.
server {
    listen 127.0.0.1:18135 ssl;
    server_name 127.0.0.1;
    ssl_certificate /run/propr-tls/server.crt;
    ssl_certificate_key /run/propr-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1m;
    allow 127.0.0.1;
    deny all;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;

    location = /api/mcp {
        allow 127.0.0.1;
        deny all;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:18122;
    }
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource(/api/mcp)?)$ {
        proxy_pass http://127.0.0.1:18122;
    }
    location / { return 404; }
}
