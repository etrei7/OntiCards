map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Existing New API performs model authorization, quota, expiry and revocation.
# This dedicated listener exposes only the synthetic preview inference operation.
limit_req_zone $binary_remote_addr zone=onticards_preview_model:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=onticards_preview_model_conn:1m;
server {
    listen 10.66.66.5:18134;
    server_name _;
    allow 127.0.0.1;
    allow 10.66.66.5;
    deny all;
    client_max_body_size 128k;
    client_body_timeout 10s;
    # Do not log Authorization, request bodies, or inference responses.
    access_log off;
    location = /v1/chat/completions {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        limit_req zone=onticards_preview_model burst=4 nodelay;
        limit_req_status 429;
        limit_conn onticards_preview_model_conn 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000/v1/chat/completions;
        proxy_set_header Host 127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header api-key "";
        proxy_set_header x-api-key "";
        proxy_set_header Sec-WebSocket-Protocol "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }
    location = /v1/embeddings {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        limit_req zone=onticards_preview_model burst=4 nodelay;
        limit_req_status 429;
        limit_conn onticards_preview_model_conn 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000/v1/embeddings;
        proxy_set_header Host 127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header api-key "";
        proxy_set_header x-api-key "";
        proxy_set_header Sec-WebSocket-Protocol "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
server {
    listen 10.66.66.5:18123;
    server_name _;
    client_max_body_size 20m;
    location = /onticards-reports/ {
        alias /usr/share/nginx/onticards-reports/;
        autoindex on;
        charset utf-8;
        limit_except GET { deny all; }
    }
    location ~ "^/onticards-reports/([0-9]{4}-[0-9]{2}-[0-9]{2}\.(json|md))$" {
        alias /usr/share/nginx/onticards-reports/$1;
        charset utf-8;
        types { application/json json; text/plain md; }
        default_type text/plain;
        limit_except GET { deny all; }
    }
    location = /onticards-reports/acceptance/pdf-3105/playwright/index.html {
        alias /usr/share/nginx/onticards-reports/acceptance/pdf-3105/playwright/index.html;
        charset utf-8;
        disable_symlinks on;
        add_header Content-Disposition 'attachment; filename="OntiCards-PR26-Playwright.html"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-downloads" always;
        limit_except GET { deny all; }
    }
    location ^~ /onticards-reports/acceptance/pdf-3105/ {
        alias /usr/share/nginx/onticards-reports/acceptance/pdf-3105/;
        index index.html;
        autoindex off;
        charset utf-8;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-downloads" always;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }
    location ^~ /onticards-reports/acceptance/pr33-fdd3/ {
        alias /usr/share/nginx/onticards-reports/acceptance/pr33-fdd3/;
        index index.html;
        autoindex off;
        charset utf-8;
        disable_symlinks on;
        types { text/html html; image/png png; application/pdf pdf; application/json json; text/plain md txt diff; application/xml xml; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-downloads" always;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }
    location ^~ /onticards-reports/acceptance/pr26-rootless-3105/ {
        alias /usr/share/nginx/onticards-reports/acceptance/pr26-rootless-3105/;
        index index.html;
        autoindex off;
        charset utf-8;
        disable_symlinks on;
        types { text/html html; image/png png; application/pdf pdf; application/json json; text/plain md txt diff; application/xml xml; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-downloads" always;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }
    location ^~ /onticards-reports/acceptance/maintenance-20261023/ {
        alias /usr/share/nginx/onticards-reports/acceptance/maintenance-20261023/;
        index index.html;
        autoindex off;
        charset utf-8;
        disable_symlinks on;
        types { text/html html; image/png png; application/pdf pdf; application/json json; text/plain md txt diff; application/xml xml; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-downloads" always;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }
    location /onticards-reports/ { return 404; }
    location = /api/mcp { return 404; }
    location ^~ /api/mcp/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:18122;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:18122;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:18125;
        proxy_set_header Host $http_host;
    }
}
